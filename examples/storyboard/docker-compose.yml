services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storyboard
      POSTGRES_PASSWORD: storyboard
      POSTGRES_DB: storyboard
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyboard"]
      interval: 2s
      retries: 30
  site:
    build: ./site
    environment:
      DATABASE_URL: postgres://storyboard:storyboard@db:5432/storyboard
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
